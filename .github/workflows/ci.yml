name: Continuous integration

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: windows-latest
        timeout-minutes: 20
        steps:
            - name: Check out
              uses: actions/checkout@v4
            - name: Install .NET SDK
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x
            - name: Test contact parser and search
              run: dotnet run --project tests/contact-palette-tests/contact-palette-tests.csproj --configuration Release
            - name: Build and validate unsigned x64 and ARM64 packages
              shell: pwsh
              run: ./build-extension.ps1 -Development
            - name: Smoke test the x64 COM server
              shell: pwsh
              run: |
                  $exe = Get-ChildItem work/build-*/x64/contact-palette.exe | Select-Object -Last 1
                  dotnet run --project tests/contact-palette-windows-tests -c Release -p:Platform=x64 -p:EnableMsixTooling=false -- $exe.FullName
                  if ($LASTEXITCODE -ne 0) { throw 'COM smoke test failed.' }
            - name: Audit dependencies
              run: dotnet list src/contact-palette/contact-palette.csproj package --vulnerable --include-transitive
            - name: Upload local test packages (no publication)
              uses: actions/upload-artifact@v4
              with:
                  name: ContactPalette-development-unsigned
                  path: artifacts/*
                  if-no-files-found: error
